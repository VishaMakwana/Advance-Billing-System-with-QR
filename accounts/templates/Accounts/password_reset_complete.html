<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password updated | Billwise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: radial-gradient(circle at 80% 10%, #dff5ee, transparent 30%), #f4f7fb; color: #172b4d; }
        .reset-card { max-width: 460px; border: 0; border-radius: 22px; box-shadow: 0 24px 70px #19345216; }
        .brand-mark, .check-icon { display: grid; place-items: center; color: #fff; background: #146c5b; }
        .brand-mark { width: 48px; height: 48px; border-radius: 15px; font-size: 1.2rem; font-weight: 800; }
        .check-icon { width: 54px; height: 54px; margin: 24px 0 18px; border-radius: 17px; font-size: 1.7rem; }
        .btn-primary { background: #146c5b; border-color: #146c5b; border-radius: 10px; font-weight: 700; }
        .btn-primary:hover { background: #105649; border-color: #105649; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card reset-card p-4 p-md-5 w-100">
    <div class="brand-mark">B</div>
    <div class="check-icon" aria-hidden="true">✓</div>
    <h1 class="h3 fw-bold">Password updated</h1>
    <p class="text-secondary mb-4">Your password has been changed. Sign in with your new password to continue.</p>
    <a class="btn btn-primary w-100 py-2" href="{% url 'login' %}">Sign in</a>
</main>
</body>
</html>
