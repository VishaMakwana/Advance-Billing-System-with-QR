<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check your email | Billwise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: radial-gradient(circle at 80% 10%, #dff5ee, transparent 30%), #f4f7fb; color: #172b4d; }
        .reset-card { max-width: 460px; border: 0; border-radius: 22px; box-shadow: 0 24px 70px #19345216; }
        .brand-mark, .mail-icon { display: grid; place-items: center; color: #fff; background: #146c5b; }
        .brand-mark { width: 48px; height: 48px; border-radius: 15px; font-size: 1.2rem; font-weight: 800; }
        .mail-icon { width: 54px; height: 54px; margin: 24px 0 18px; border-radius: 17px; }
        .mail-icon svg { width: 27px; height: 27px; }
        .btn-primary { background: #146c5b; border-color: #146c5b; border-radius: 10px; font-weight: 700; }
        .btn-primary:hover { background: #105649; border-color: #105649; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card reset-card p-4 p-md-5 w-100">
    <div class="brand-mark">B</div>
    <div class="mail-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
    </div>
    <h1 class="h3 fw-bold">Check your inbox</h1>
    <p class="text-secondary mb-4">If an account exists for the email address you entered, we’ve sent a password reset link. Open that link to enter and confirm your new password. Check your inbox and spam folder.</p>
    <a class="btn btn-primary w-100 py-2" href="{% url 'login' %}">Back to sign in</a>
</main>
</body>
</html>
