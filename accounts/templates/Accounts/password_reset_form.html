<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | Billwise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: radial-gradient(circle at 80% 10%, #dff5ee, transparent 30%), #f4f7fb; color: #172b4d; }
        .reset-card { max-width: 460px; border: 0; border-radius: 22px; box-shadow: 0 24px 70px #19345216; }
        .brand-mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: #fff; background: #146c5b; font-weight: 800; font-size: 1.2rem; }
        input[type="email"] { width: 100%; min-height: 48px; padding: 10px 13px; border: 1px solid #dce5ed; border-radius: 10px; }
        input[type="email"]:focus { border-color: #4aa48e; outline: 0; box-shadow: 0 0 0 .2rem #4aa48e22; }
        .btn-primary { background: #146c5b; border-color: #146c5b; border-radius: 10px; font-weight: 700; }
        .btn-primary:hover { background: #105649; border-color: #105649; }
        .back-link { color: #146c5b; font-size: .88rem; font-weight: 600; text-decoration: none; }
        .errorlist { margin: 6px 0 0; padding: 0; color: #b42318; font-size: .85rem; list-style: none; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card reset-card p-4 p-md-5 w-100">
    <div class="brand-mark mb-4">B</div>
    <div class="text-uppercase small text-success fw-bold">Billwise billing</div>
    <h1 class="h2 fw-bold mt-2 mb-2">Forgot your password?</h1>
    <p class="text-secondary mb-4">Enter the email address linked to your account. If it matches, we’ll send you a secure reset link.</p>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label fw-semibold" for="{{ form.email.id_for_label }}">Email address</label>
            {{ form.email }}
            {{ form.email.errors }}
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Send reset link</button>
    </form>
    <p class="text-center mt-4 mb-0"><a class="back-link" href="{% url 'login' %}">← Back to sign in</a></p>
</main>
</body>
</html>
