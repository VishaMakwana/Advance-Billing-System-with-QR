<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin workspace | Billwise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #f4f7fb; color: #172b4d; }
        .admin-card { border: 0; border-radius: 22px; box-shadow: 0 24px 70px #19345216; }
        .brand-mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: #fff; background: #146c5b; font-weight: 800; font-size: 1.2rem; }
        .btn-success { background: #146c5b; border-color: #146c5b; }
        .btn-success:hover { background: #105649; border-color: #105649; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card admin-card p-4 p-md-5 w-100" style="max-width: 720px;">
    <div class="brand-mark mb-4">B</div>
    <div class="small text-uppercase text-success fw-bold">Billwise administration</div>
    <h1 class="h2 fw-bold mt-2">Welcome, {{ user.username }}.</h1>
    <p class="text-secondary">Manage distributor accounts and invoices from the Django administration site.</p>
    <div class="d-flex flex-wrap gap-2 mt-3">
        <a class="btn btn-success px-4" href="{% url 'admin:index' %}">Open admin site</a>
        <a class="btn btn-light px-4" href="{% url 'logout' %}">Sign out</a>
    </div>
</main>
</body>
</html>
